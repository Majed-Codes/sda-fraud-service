[project]
name = "fraud-service"
version = "0.1.0"
description = "Fraud-scoring notebook (pre-refactor)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    # starlette's TestClient deprecates the httpx 0.x transport; httpx2 is the
    # supported one and keeps the suite's output free of warnings.
    "httpx2",
]
dev = [
    "fraud-service[test]",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: pure logic, no model artefact, no HTTP",
    "integration: exercises the API through a TestClient with a stubbed model",
    "behavioural: asserts on the real model artefact's behaviour",
    "slow: excluded from the default inner-loop run",
]
addopts = "--strict-markers -W error::DeprecationWarning"

[tool.coverage.run]
branch = true
source = ["fraud_service"]
omit = [
    # A main() composition root with no logic of its own to cover.
    "*/fraud_service/batch.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are requested by name, so pytest passes arguments a plain function
# would never use; ARG001 flags exactly that pattern.
"tests/*" = ["ARG001"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
files = ["src/fraud_service"]

[[tool.mypy.overrides]]
# joblib and sklearn ship no type information; the adapter is the one place
# allowed to touch them, and it re-types their output at its boundary.
module = ["joblib.*", "sklearn.*", "pandas.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "fraud_service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "fraud_service.api",
    "fraud_service.adapters",
    "fraud_service.service",
    "fraud_service.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and service stay framework-free"
type = "forbidden"
source_modules = ["fraud_service.domain", "fraud_service.service"]
forbidden_modules = ["fastapi", "starlette", "sklearn", "joblib", "pandas"]

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - feature-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-service:slim
    environment:
      FRAUD_REDIS_URL: redis://redis:6379/0
      FRAUD_LOG_LEVEL: INFO
      FRAUD_GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 3
    # Sized deliberately: the numeric stack idles near 300MB, so a second
    # worker under load hits this ceiling rather than the host's.
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  feature-cache:
